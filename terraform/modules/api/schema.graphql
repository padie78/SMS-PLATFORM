schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# --- ENUMS ---
enum NodeType { ORGANIZATION; REGION; BRANCH; BUILDING; ASSET; METER; COST_CENTER }

enum InvoiceStatus {
  UPLOADED
  PROCESSING
  READY_FOR_REVIEW
  AI_VALIDATION_REQUIRED
  FAILED
  CONFIRMED
  POSTED
  PERSISTED
}

enum EnergyServiceType {
  ELECTRICITY
  GAS
  WATER
  STEAM
}

# --- TIPOS DE RESPUESTA (Autorización Unificada) ---
type MutationResponse @aws_api_key @aws_cognito_user_pools {
  success: Boolean!
  message: String
  id: ID
  """SK segment id (sin prefijo ORGANIZATION#); útil para redirigir tras crear empresa."""
  nodeId: ID
  path: String
  entity: AWSJSON
}

type InvoiceLifecycleMutationResult @aws_api_key @aws_cognito_user_pools {
  success: Boolean!
  message: String
  invoiceId: ID
  version: Int
  status: String
  updatedAt: String
  correlationId: String
}

type PresignedUploadUrl @aws_api_key @aws_cognito_user_pools {
  uploadURL: String!
  key: String!
  invoiceId: ID!
}

type Node @aws_api_key @aws_cognito_user_pools {
  id: ID!
  parentId: ID
  path: String!
  nodeType: NodeType!
  name: String!
  metadata: AWSJSON
}

type Invoice @aws_api_key @aws_cognito_user_pools {
  id: ID!
  status: String
  vendor: String
  totalAmount: Float
  extractedData: AWSJSON
  message: String
}

# --- INPUTS (sin tenantId: el aislamiento multi-tenant viene de Cognito) ---
input SaveNodeInput {
  id: ID
  nodeId: ID
  orgId: ID
  parentId: ID
  nodeType: NodeType!
  name: String!
  metadata: AWSJSON
}

input UpdateNodeInput {
  name: String
  metadata: AWSJSON
}

input CreateInvoiceDraftInput {
  fileName: String!
  fileSize: Int!
  mimeType: String!
  branchId: ID
  buildingId: ID
  documentHashSha256: String
}

input InvoiceFieldCorrectionInput {
  field: String!
  oldValue: String
  newValue: String
  reason: String
  originalConfidence: Float
}

input CommitInvoiceLifecycleInput {
  invoiceId: ID!
  expectedVersion: Int
  extractionDraftVersion: Int
  vendor: String!
  vendorTaxId: String!
  invoiceNumber: String!
  invoiceDate: String!
  dueDate: String
  billingPeriodStart: String!
  billingPeriodEnd: String!
  currency: String!
  totalAmount: Float!
  taxAmount: Float
  subtotalAmount: Float
  consumptionValue: Float!
  consumptionUnit: String!
  meterId: ID
  energyType: EnergyServiceType!
  branchId: ID!
  buildingId: ID!
  costCenterId: ID
  assetId: ID
  corrections: [InvoiceFieldCorrectionInput!]
  notes: String
  wipSnapshotHash: String
}

# --- CONSULTAS ---
type Query {
  getTree(rootNodeId: ID, orgId: ID): [Node] @aws_cognito_user_pools
  getNode(id: ID!, orgId: ID): Node @aws_cognito_user_pools
  getInvoice(id: ID!): Invoice @aws_cognito_user_pools
  getInvoiceLifecycle(invoiceId: ID!): AWSJSON @aws_cognito_user_pools
}

# --- ACCIONES ---
type Mutation {
  saveNode(input: SaveNodeInput!): MutationResponse @aws_cognito_user_pools
  updateNode(id: ID!, orgId: ID, input: UpdateNodeInput!): MutationResponse @aws_cognito_user_pools
  deleteNode(id: ID!, orgId: ID): MutationResponse @aws_cognito_user_pools

  getPresignedUrl(fileName: String!, fileType: String!, invoiceId: ID!): PresignedUploadUrl
    @aws_cognito_user_pools

  createInvoiceDraft(input: CreateInvoiceDraftInput!): InvoiceLifecycleMutationResult
    @aws_cognito_user_pools

  commitInvoiceLifecycle(input: CommitInvoiceLifecycleInput!): InvoiceLifecycleMutationResult
    @aws_cognito_user_pools

  updateInvoiceStatus(
    id: ID!
    status: String!
    extractedData: AWSJSON
    message: String
  ): Invoice @aws_api_key @aws_cognito_user_pools
}

# --- SUSCRIPCIONES ---
type Subscription {
  onInvoiceUpdated: Invoice
    @aws_subscribe(mutations: ["updateInvoiceStatus"])
    @aws_api_key @aws_cognito_user_pools

  onNodeChanged: MutationResponse
    @aws_subscribe(mutations: ["saveNode", "updateNode", "deleteNode"])
    @aws_api_key @aws_cognito_user_pools
}
